[package]
name = "birdman-game-bevy"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Native Screen adapter for the existing Birdman hybrid game session"

[features]
default = []
verify-harness = []

[dependencies]
birdman-game-app.workspace = true
birdman-game-core.workspace = true
birdman-game-presentation.workspace = true
birdman-game-scene.workspace = true

[target.'cfg(any(target_os = "windows", target_os = "linux", target_os = "macos"))'.dependencies]
birdman-game-format.workspace = true
serde.workspace = true
serde_json.workspace = true
parley = { version = "=0.9.0", default-features = false, features = ["std", "complex-scripts"] }
bevy = { version = "=0.19.1", default-features = false, features = [
  "std", "async_executor", "multi_threaded", "bevy_asset", "bevy_log", "bevy_gilrs",
  "bevy_window", "bevy_winit", "bevy_camera", "bevy_color", "bevy_image",
  "bevy_mesh", "bevy_shader", "bevy_material", "bevy_light", "bevy_render",
  "bevy_core_pipeline", "bevy_pbr", "bevy_text", "bevy_ui", "bevy_ui_render", "bevy_input_focus", "ui_picking", "png"
] }

[target.'cfg(target_os = "linux")'.dependencies]
bevy = { version = "=0.19.1", default-features = false, features = ["x11", "wayland"] }

[lints]
workspace = true
