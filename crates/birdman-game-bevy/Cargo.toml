[package]
name = "birdman-game-bevy"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Native Screen adapter for the existing Birdman hybrid game session"

[dependencies]
birdman-game-core.workspace = true
birdman-game-session = { path = "../birdman-game-session" }

[target.'cfg(target_os = "windows")'.dependencies]
serde.workspace = true
serde_json.workspace = true
parley = { version = "=0.9.0", default-features = false, features = ["std", "complex-scripts"] }
bevy = { version = "=0.19.1", default-features = false, features = [
  "std", "async_executor", "multi_threaded", "bevy_asset", "bevy_log",
  "bevy_window", "bevy_winit", "bevy_camera", "bevy_color", "bevy_image",
  "bevy_mesh", "bevy_shader", "bevy_material", "bevy_light", "bevy_render",
  "bevy_core_pipeline", "bevy_pbr", "bevy_text", "bevy_ui", "bevy_ui_render", "bevy_input_focus", "ui_picking", "png"
] }

[lints]
workspace = true
