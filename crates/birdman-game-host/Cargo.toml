[package]
name = "birdman-game-host"
autobins = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Native I/O and network hosting for shared Birdman application sessions"

[[bin]]
name = "birdman-game-server"
path = "src/bin/server.rs"
required-features = ["server-ui"]

# The live-clock journey runs explicitly with the production release profile.
[[test]]
name = "remote_session"
path = "tests/remote_session.rs"
test = false

[features]
server-ui = ["dep:eframe"]

[dependencies]
birdman-game-app.workspace = true
birdman-game-format.workspace = true
birdman-game-presentation.workspace = true
birdman-game-runtime.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
axum = { version = "=0.8.9", default-features = false, features = ["http1", "tokio", "ws", "json"] }
axum-server = { version = "=0.8.0", default-features = false, features = ["tls-rustls-no-provider"] }
tokio = { version = "=1.53.2", default-features = false, features = ["rt-multi-thread", "net", "process", "io-util", "sync", "time", "macros"] }
futures-util = { version = "=0.3.34", default-features = false, features = ["sink", "std"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
log = "=0.4.34"
url.workspace = true
bytes = "=1.12.1"
hyper = { version = "=1.12.0", default-features = false, features = ["client", "http1"] }
hyper-util = { version = "=0.1.21", default-features = false, features = ["client", "client-legacy", "http1", "tokio"] }
http-body-util = "=0.1.5"
tokio-tungstenite = { version = "=0.29.0", default-features = false, features = ["connect", "rustls-tls-native-roots"] }
hyper-rustls = { version = "=0.27.9", default-features = false, features = ["http1", "ring", "tls12"] }
rustls-platform-verifier = "=0.7.1"
eframe = { version = "=0.33.3", default-features = false, features = ["glow", "wayland", "x11"], optional = true }
rfd = "=0.15.4"
serialport = { version = "=4.10.1", default-features = false }

[dev-dependencies]
birdman-game-core.workspace = true

[lints]
workspace = true
