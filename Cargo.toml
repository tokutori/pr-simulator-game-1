[workspace]
members = ["crates/*"]
exclude = ["vendor/parley"]
resolver = "3"

[patch.crates-io]
parley = { path = "vendor/parley" }

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
repository = "https://github.com/tokutori/pr-simulator-game-1"

[workspace.dependencies]
birdman-game-app = { path = "crates/birdman-game-app" }
birdman-game-core = { path = "crates/birdman-game-core" }
birdman-game-content = { path = "crates/birdman-game-content" }
birdman-game-format = { path = "crates/birdman-game-format" }
birdman-game-presentation = { path = "crates/birdman-game-presentation" }
birdman-game-scene = { path = "crates/birdman-game-scene" }
libm = "=0.2.16"
wasm-bindgen = "=0.2.129"
serde = { version = "=1.0.229", default-features = false, features = ["alloc", "derive"] }
serde_json = { version = "=1.0.151", default-features = false, features = ["alloc", "float_roundtrip"] }
sha2 = { version = "=0.11.0", default-features = false }
schemars = { version = "=1.2.2", default-features = false, features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(verus_only)'] }

[workspace.lints.clippy]
all = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
