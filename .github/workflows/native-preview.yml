name: Native preview artifacts

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full reviewed source SHA (empty resolves main once)
        required: false
        default: ''
        type: string
  pull_request:
    types: [opened, reopened, synchronize, labeled]

permissions:
  contents: read

concurrency:
  group: native-preview-${{ github.event.pull_request.head.sha || inputs.source_sha || github.ref }}
  cancel-in-progress: false

jobs:
  source:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       contains(github.event.pull_request.labels.*.name, 'native-preview-build') &&
       (github.event.action != 'labeled' || github.event.label.name == 'native-preview-build'))
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      matrix: ${{ steps.config.outputs.matrix }}
      toolchain: ${{ steps.config.outputs.toolchain }}
    steps:
      - name: Freeze one source commit
        id: source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_SHA: ${{ github.event.pull_request.head.sha || inputs.source_sha }}
        run: |
          set -euo pipefail
          source_sha="$REQUESTED_SHA"
          if [ -z "$source_sha" ]; then
            source_sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          fi
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]] || { echo 'A full source SHA is required'; exit 1; }
          echo "sha=$source_sha" >> "$GITHUB_OUTPUT"
          printf 'Source: `%s`\n\nEvent: `%s`\n' "$source_sha" "$GITHUB_EVENT_NAME" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ steps.source.outputs.sha }}
          persist-credentials: false
      - name: Resolve native hosts and pinned toolchain
        id: config
        shell: bash
        run: |
          echo "matrix=$(python3 tools/native-release/package_native.py matrix)" >> "$GITHUB_OUTPUT"
          python3 -c 'import os, tomllib; channel = tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"]; open(os.environ["GITHUB_OUTPUT"], "a").write(f"toolchain={channel}\n")'

  build:
    name: Native Release (${{ matrix.target }})
    needs: source
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.source.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    env:
      RUSTUP_TOOLCHAIN: ${{ needs.source.outputs.toolchain }}-${{ matrix.target }}
      BPG_NATIVE_SOURCE_SHA: ${{ needs.source.outputs.sha }}
      NATIVE_WORKFLOW_RUN: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
      CARGO_INCREMENTAL: '0'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Install native Linux window dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libudev-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libwayland-dev libxkbcommon-dev libxkbcommon-x11-0
      - name: Install the pinned native-host toolchain
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --no-self-update
          rustc -vV
          actual_host=$(rustc -vV | sed -n 's/^host: //p' | tr -d '\r')
          test "$actual_host" = '${{ matrix.target }}'
      - name: Build the real native application
        run: cargo build -p birdman-game-bevy --release --locked --target '${{ matrix.target }}'
      - name: Validate architecture and CPU-only startup outside the source tree
        run: |
          binary='target/${{ matrix.target }}/release/birdman-game-bevy'
          if [ "$RUNNER_OS" = Windows ]; then binary="$binary.exe"; fi
          python tools/native-release/package_native.py stage --binary "$binary" --target '${{ matrix.target }}' --source-sha "$BPG_NATIVE_SOURCE_SHA" --output native-raw
      - name: Upload validated raw binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-raw-${{ matrix.target }}-${{ needs.source.outputs.sha }}
          path: native-raw/*.tar.gz
          compression-level: 0
          if-no-files-found: error
          retention-days: 7

  licenses:
    name: Native third-party notices
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RUSTUP_TOOLCHAIN: ${{ needs.source.outputs.toolchain }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false
      - name: Install pinned metadata toolchain
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --no-self-update
      - name: Install checksum-verified cargo-about
        shell: bash
        run: |
          set -euo pipefail
          archive=cargo-about-0.9.2-x86_64-unknown-linux-musl.tar.gz
          curl --fail --location --retry 3 "https://github.com/EmbarkStudios/cargo-about/releases/download/0.9.2/$archive" -o "$RUNNER_TEMP/$archive"
          echo "9099a59e820c38a68b9d65f300662a567d56562f9a10f6aa4c7e86c17c2566af  $RUNNER_TEMP/$archive" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP"
      - name: Generate notices for all six native targets
        run: python3 tools/native-release/package_native.py licenses --cargo-about "$RUNNER_TEMP/cargo-about-0.9.2-x86_64-unknown-linux-musl/cargo-about" --source-sha '${{ needs.source.outputs.sha }}' --output native-licenses
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-licenses-${{ needs.source.outputs.sha }}
          path: native-licenses/*
          if-no-files-found: error
          retention-days: 7

  package:
    name: Assemble six same-source preview archives
    needs: [source, build, licenses]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NATIVE_WORKFLOW_RUN: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: native-raw-*-${{ needs.source.outputs.sha }}
          path: native-raw
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-licenses-${{ needs.source.outputs.sha }}
          path: native-licenses
      - name: Assemble and checksum the complete set
        run: python3 tools/native-release/package_native.py assemble --binaries native-raw --licenses native-licenses --source-sha '${{ needs.source.outputs.sha }}' --output native-preview
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-preview-${{ needs.source.outputs.sha }}
          path: native-preview/*
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
