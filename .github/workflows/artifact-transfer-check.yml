name: Artifact transfer check

on:
  workflow_dispatch:
    inputs:
      artifact_id:
        description: Existing native license artifact ID (empty selects the latest unexpired one)
        required: false
        default: ''
        type: string
  pull_request:
    paths:
      - .github/workflows/native-preview.yml
      - .github/workflows/artifact-transfer-check.yml

permissions:
  contents: read
  actions: read

jobs:
  transfer:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      receipt: ${{ steps.source.outputs.receipt }}
    steps:
      - name: Select one existing native license artifact
        id: source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_ID: ${{ inputs.artifact_id }}
        run: |
          set -euo pipefail
          artifact_id="$REQUESTED_ID"
          if [ -z "$artifact_id" ]; then
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" > "$RUNNER_TEMP/artifacts.json"
            artifact_id=$(jq -r '[.artifacts[] | select(.expired == false and (.name | test("^native-licenses-[0-9a-f]{40}$")))] | sort_by(.created_at) | last | .id // empty' "$RUNNER_TEMP/artifacts.json")
          fi
          [[ "$artifact_id" =~ ^[0-9]+$ ]] || { echo 'An existing native license artifact ID is required'; exit 1; }
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id" > "$RUNNER_TEMP/source-artifact.json"
          jq -e '.expired == false and (.name | test("^native-licenses-[0-9a-f]{40}$"))' "$RUNNER_TEMP/source-artifact.json" > /dev/null
          run_id=$(jq -r '.workflow_run.id' "$RUNNER_TEMP/source-artifact.json")
          [[ "$run_id" =~ ^[0-9]+$ ]]
          source_sha=$(jq -r '.name | sub("^native-licenses-"; "")' "$RUNNER_TEMP/source-artifact.json")
          echo "artifact_id=$artifact_id" >> "$GITHUB_OUTPUT"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "receipt=artifact-transfer-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
          printf 'Source artifact: `%s`\n\nSource run: `%s`\n\nSource SHA: `%s`\n' "$artifact_id" "$run_id" "$source_sha" >> "$GITHUB_STEP_SUMMARY"
      - name: Download existing data with the production transfer Action
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ steps.source.outputs.artifact_id }}
          run-id: ${{ steps.source.outputs.run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: verification/payload
      - name: Record source identity, file paths and hashes
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
        run: |
          set -euo pipefail
          cd verification
          test -z "$(find payload -type l -print -quit)"
          jq -e --arg sha "$EXPECTED_SOURCE_SHA" '.source_sha == $sha' payload/LICENSE-INFO.json > /dev/null
          find payload -type f -print0 | LC_ALL=C sort -z > PATHS
          test -s PATHS
          xargs -0 sha256sum < PATHS > SHA256SUMS
      - name: Upload the unchanged data and checksum receipt
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ${{ steps.source.outputs.receipt }}
          path: verification/
          if-no-files-found: error
          retention-days: 3

  verify:
    needs: transfer
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download the transferred artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ${{ needs.transfer.outputs.receipt }}
          path: roundtrip
      - name: Verify identical file paths and content
        shell: bash
        run: |
          set -euo pipefail
          cd roundtrip
          test -z "$(find payload -type l -print -quit)"
          find payload -type f -print0 | LC_ALL=C sort -z | cmp - PATHS
          sha256sum --check --strict SHA256SUMS
