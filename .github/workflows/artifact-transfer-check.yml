name: Artifact transfer check

on:
  workflow_dispatch:
    inputs:
      artifact_id:
        description: Existing native license artifact ID (empty selects the latest unexpired one)
        required: false
        default: ''
        type: string
  pull_request:
    paths:
      - .github/workflows/native-preview.yml
      - .github/workflows/artifact-transfer-check.yml
      - tools/native-release/package_native.py
      - tools/native-release/artifact_transfer.py
      - tools/native-release/test_package_native.py

permissions:
  contents: read
  actions: read

jobs:
  transfer:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      receipt: ${{ steps.source.outputs.receipt }}
      reference_sha256: ${{ steps.reference.outputs.sha256 }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Select one existing native license artifact
        id: source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_ID: ${{ inputs.artifact_id }}
        run: |
          set -euo pipefail
          artifact_id="$REQUESTED_ID"
          if [ -z "$artifact_id" ]; then
            gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" > "$RUNNER_TEMP/artifacts.json"
            python3 tools/native-release/artifact_transfer.py select --pages "$RUNNER_TEMP/artifacts.json" --output "$RUNNER_TEMP/source-artifact.json"
            artifact_id=$(jq -r '.id' "$RUNNER_TEMP/source-artifact.json")
          fi
          [[ "$artifact_id" =~ ^[0-9]+$ ]] || { echo 'An existing native license artifact ID is required'; exit 1; }
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id" > "$RUNNER_TEMP/source-artifact.json"
          source_sha=$(python3 tools/native-release/artifact_transfer.py identity --artifact "$RUNNER_TEMP/source-artifact.json")
          run_id=$(jq -r '.workflow_run.id' "$RUNNER_TEMP/source-artifact.json")
          [[ "$run_id" =~ ^[0-9]+$ ]]
          echo "artifact_id=$artifact_id" >> "$GITHUB_OUTPUT"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "receipt=artifact-transfer-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
          printf 'Source artifact: `%s`\n\nSource run: `%s`\n\nSource SHA: `%s`\n' "$artifact_id" "$run_id" "$source_sha" >> "$GITHUB_STEP_SUMMARY"
      - name: Read the selected producer source separately from the verifier
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ steps.source.outputs.source_sha }}
          path: source
          persist-credentials: false
      - name: Fix an independent reference from the API-digest-checked REST ZIP
        id: reference
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.source.outputs.artifact_id }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" > "$RUNNER_TEMP/source.zip"
          mkdir verification
          python3 tools/native-release/artifact_transfer.py reference --archive "$RUNNER_TEMP/source.zip" --artifact "$RUNNER_TEMP/source-artifact.json" --source source --output verification/reference.json
          echo "sha256=$(sha256sum verification/reference.json | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - name: Download existing data with the production transfer Action
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ steps.source.outputs.artifact_id }}
          run-id: ${{ steps.source.outputs.run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: verification/payload
      - name: Verify the initial Action transfer against the independent reference
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/native-release/artifact_transfer.py verify --payload verification/payload --reference verification/reference.json
      - name: Upload the unchanged data and checksum receipt
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ${{ steps.source.outputs.receipt }}
          path: verification/
          if-no-files-found: error
          retention-days: 3

  verify:
    needs: transfer
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Download the transferred artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ${{ needs.transfer.outputs.receipt }}
          path: roundtrip
      - name: Verify identical file paths and content
        shell: bash
        env:
          EXPECTED_REFERENCE_SHA256: ${{ needs.transfer.outputs.reference_sha256 }}
        run: |
          set -euo pipefail
          echo "$EXPECTED_REFERENCE_SHA256  roundtrip/reference.json" | sha256sum --check --strict
          python3 tools/native-release/artifact_transfer.py verify --payload roundtrip/payload --reference roundtrip/reference.json
