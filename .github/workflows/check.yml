name: Check

on:
  push:
    branches: [main, bevy]
  pull_request:
  workflow_dispatch:
    inputs:
      deploy_pages:
        description: Publish the verified main build to GitHub Pages
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && inputs.deploy_pages && 'pages' || 'check' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && inputs.deploy_pages) }}

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      RUSTDOCFLAGS: -D warnings
      CARGO_PROFILE_DEV_DEBUG: '1'
      CARGO_PROFILE_TEST_DEBUG: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.14.1'
          cache: npm
      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          rustup toolchain install --no-self-update
          rustup default "$(rustup show active-toolchain | cut -d ' ' -f1)"
          rustup toolchain uninstall stable
      - name: Install native Linux window dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 15
        run: |
          sudo apt-get -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::Retries=3 update --error-on=any
          sudo apt-get -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::Retries=3 install -y --no-install-recommends pkg-config libudev-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libwayland-dev libxkbcommon-dev libxkbcommon-x11-0 libvulkan1 mesa-vulkan-drivers
      - name: Cache Rust dependencies and tools
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: . -> target
          key: check-${{ hashFiles('Cargo.toml') }}
          save-if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.deploy_pages)) }}
      - name: Install Windows compiler cache
        if: runner.os == 'Windows'
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.18.0
      - name: Configure Windows compiler cache
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          CACHE_MODE: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.deploy_pages)) && 'READ_WRITE' || 'READ_ONLY' }}
        run: |
          @(
            'RUSTC_WRAPPER=sccache'
            'CARGO_INCREMENTAL=0'
            'SCCACHE_GHA_ENABLED=on'
            'SCCACHE_GHA_VERSION=birdman-check-windows-v1'
            "SCCACHE_GHA_RW_MODE=$env:CACHE_MODE"
          ) | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
        env:
          RUSTC_WRAPPER: ''
      - name: Lint native verification and OpenXR features
        run: cargo clippy -p birdman-game-bevy --all-targets --features verify-harness,openxr --locked -- -D warnings
        env:
          RUSTC_WRAPPER: ''
      - name: Test workspace packages (Linux)
        if: runner.os == 'Linux'
        run: cargo test --workspace --features birdman-game-bevy/verify-harness,birdman-game-bevy/openxr --locked
      - name: Test shared and Web packages (Windows)
        if: runner.os == 'Windows'
        run: cargo test --workspace --exclude birdman-game-bevy --locked
      - name: Test Bevy native Screen (Windows)
        if: runner.os == 'Windows'
        run: cargo test -p birdman-game-bevy --features verify-harness,openxr --locked
      - name: Build ordinary Bevy native Screen executable
        run: cargo build -p birdman-game-bevy --locked
      - name: Verify ordinary native CLI without the harness (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          binary=./target/debug/birdman-game-bevy
          "$binary" --help
          "$binary" --version
          if output=$("$binary" --verify unused --offscreen 2>&1); then
            echo 'Native harness flag unexpectedly succeeded'; exit 1
          fi
          grep -F -- 'requires --features verify-harness' <<< "$output"
      - name: Verify ordinary native CLI without the harness (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & ./target/debug/birdman-game-bevy.exe --help
          if ($LASTEXITCODE -ne 0) { throw 'Native help failed' }
          & ./target/debug/birdman-game-bevy.exe --version
          if ($LASTEXITCODE -ne 0) { throw 'Native version failed' }
          $output = & ./target/debug/birdman-game-bevy.exe --verify unused --offscreen 2>&1 | Out-String
          if ($LASTEXITCODE -eq 0 -or $output -notmatch 'requires --features verify-harness') {
            throw "Native harness flag was not rejected: $output"
          }
          $global:LASTEXITCODE = 0
      - name: Measure native hybrid hot-path allocations
        run: python tools/allocation-check/main.py
      - name: Verify offline environment source extraction
        shell: bash
        run: |
          python -m unittest discover -s tools/environment-build -v
          python -m unittest discover -s tools/world-build -v
      - name: Test native artifact packaging
        run: python -m unittest discover -s tools/native-release -v
      - run: cargo doc --workspace --no-deps --locked
      - name: Verify core without std
        run: cargo build -p birdman-game-core --target wasm32v1-none --locked
      - name: Build browser WASM adapter
        run: cargo build -p birdman-game-wasm --target wasm32-unknown-unknown --locked
      - name: Build WASI CLI
        run: cargo build -p birdman-game-cli --target wasm32-wasip2 --locked
      - name: Install matching wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli --locked --version 0.2.129
      - name: Verify hybrid flight modes
        run: cargo run -p birdman-game-cli --locked -- verify-hybrid-flight all
      - run: npm ci
      - run: npm run verify
      - name: Compare Native and WASM application traces with software Vulkan
        if: runner.os == 'Linux'
        timeout-minutes: 15
        shell: bash
        env:
          WGPU_BACKEND: vulkan
          VK_DRIVER_FILES: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json
          XDG_RUNTIME_DIR: ${{ runner.temp }}/cross-target-xdg
        run: |
          set -euo pipefail
          output="target/cross-target-check-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          test ! -e "$output"
          test -r "$VK_DRIVER_FILES"
          install -d -m 700 "$XDG_RUNTIME_DIR"
          record_result() {
            status=$?
            trap - EXIT
            set +e
            {
              echo 'Cross-target Native/WASM result and SHA-256:'
              if [ -f "$output/result.json" ]; then cat "$output/result.json"; printf '\n'; fi
              for file in result.json native/application-trace.jsonl native/source-evidence.json; do
                if [ -f "$output/$file" ]; then sha256sum "$output/$file"; fi
              done
              if [ -f "$output/native.log" ]; then
                grep -m 1 'AdapterInfo' "$output/native.log"
                if [ "$status" -ne 0 ]; then tail -n 80 "$output/native.log"; fi
              fi
            } | tee -a "$GITHUB_STEP_SUMMARY"
            exit "$status"
          }
          trap record_result EXIT
          npm run test:cross-target -- "$output"
      - name: Configure GitHub Pages
        if: matrix.os == 'ubuntu-24.04' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.deploy_pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Upload verified site
        if: matrix.os == 'ubuntu-24.04' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.deploy_pages
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: web/dist

  native-macos:
    name: Native CLI (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '1'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install pinned native-host Rust toolchain
        run: |
          set -euo pipefail
          channel=$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
          export RUSTUP_TOOLCHAIN="$channel-${{ matrix.target }}"
          echo "RUSTUP_TOOLCHAIN=$RUSTUP_TOOLCHAIN" >> "$GITHUB_ENV"
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --no-self-update
          rustc -vV
          actual_host=$(rustc -vV | sed -n 's/^host: //p' | tr -d '\r')
          test "$actual_host" = '${{ matrix.target }}'
      - name: Cache native Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: . -> target
          key: check-native-${{ matrix.target }}-${{ hashFiles('Cargo.toml') }}
          save-if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.deploy_pages)) }}
      - name: Build ordinary Bevy native Screen executable
        run: cargo build -p birdman-game-bevy --locked
      - name: Verify ordinary native CLI without the harness
        run: |
          set -euo pipefail
          binary=./target/debug/birdman-game-bevy
          "$binary" --help
          "$binary" --version
          if output=$("$binary" --verify unused --offscreen 2>&1); then
            echo 'Native harness flag unexpectedly succeeded'; exit 1
          fi
          grep -F -- 'requires --features verify-harness' <<< "$output"

  verus-proof:
    name: Verus proof (Windows)
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Verify production core and designated rejections
        shell: pwsh
        run: ./tools/verus/check-verus.ps1

  deploy:
    name: Deploy GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.deploy_pages
    needs: [verify, native-macos, verus-proof]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy verified site
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
