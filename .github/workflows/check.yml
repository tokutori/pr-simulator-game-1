name: Check

on:
  push:
    branches: [main, bevy, 'feat/**', 'fix/**', 'chore/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.14.1'
          cache: npm
      - name: Install pinned Rust toolchain
        run: rustup toolchain install --no-self-update
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: Build Bevy native Screen executable (Windows)
        if: runner.os == 'Windows'
        run: cargo build -p birdman-game-bevy --locked
      - name: Measure native hybrid hot-path allocations
        run: python tools/allocation-check/main.py
      - name: Verify offline environment source extraction
        run: python -m unittest discover -s tools/environment-build -v
      - run: cargo doc --workspace --no-deps --locked
      - name: Verify core without std
        run: cargo build -p birdman-game-core --target wasm32v1-none --locked
      - name: Build browser WASM adapter
        run: cargo build -p birdman-game-wasm --target wasm32-unknown-unknown --locked
      - name: Build WASI CLI
        run: cargo build -p birdman-game-cli --target wasm32-wasip2 --locked
      - name: Install matching wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli --locked --version 0.2.129
      - run: cargo run -p birdman-game-cli --locked
      - run: npm ci
      - run: npm run verify
      - name: Configure GitHub Pages
        if: matrix.os == 'ubuntu-24.04' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Upload verified site
        if: matrix.os == 'ubuntu-24.04' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: web/dist

  deploy:
    name: Deploy GitHub Pages
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy verified site
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
