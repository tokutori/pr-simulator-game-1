name: Check

on:
  push:
    branches: [main, bevy]
  pull_request:
  workflow_dispatch:
    inputs:
      deploy_pages:
        description: Publish the verified main build to GitHub Pages
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && inputs.deploy_pages && 'pages' || 'check' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && inputs.deploy_pages) }}

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      RUSTDOCFLAGS: -D warnings
      CARGO_PROFILE_DEV_DEBUG: '1'
      CARGO_PROFILE_TEST_DEBUG: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.14.1'
          cache: npm
      - name: Install pinned Rust toolchain
        run: rustup toolchain install --no-self-update
      - name: Install native Linux window dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libx11-dev libxcursor-dev libxrandr-dev libxi-dev libwayland-dev libxkbcommon-dev libxkbcommon-x11-0
      - name: Cache Rust dependencies and tools
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: . -> target
          key: check-${{ hashFiles('Cargo.toml') }}
          save-if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.deploy_pages)) }}
      - name: Install Windows compiler cache
        if: runner.os == 'Windows'
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.18.0
      - name: Configure Windows compiler cache
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          CACHE_MODE: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.deploy_pages)) && 'READ_WRITE' || 'READ_ONLY' }}
        run: |
          @(
            'RUSTC_WRAPPER=sccache'
            'CARGO_INCREMENTAL=0'
            'SCCACHE_GHA_ENABLED=on'
            'SCCACHE_GHA_VERSION=birdman-check-windows-v1'
            "SCCACHE_GHA_RW_MODE=$env:CACHE_MODE"
          ) | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
        env:
          RUSTC_WRAPPER: ''
      - name: Lint native verification feature
        run: cargo clippy -p birdman-game-bevy --all-targets --features verify-harness --locked -- -D warnings
        env:
          RUSTC_WRAPPER: ''
      - name: Test workspace packages (Linux)
        if: runner.os == 'Linux'
        run: cargo test --workspace --features birdman-game-bevy/verify-harness --locked
      - name: Test shared and Web packages (Windows)
        if: runner.os == 'Windows'
        run: cargo test --workspace --exclude birdman-game-bevy --locked
      - name: Test Bevy native Screen (Windows)
        if: runner.os == 'Windows'
        run: cargo test -p birdman-game-bevy --features verify-harness --locked
      - name: Build Bevy native Screen executable (Windows)
        if: runner.os == 'Windows'
        run: cargo build -p birdman-game-bevy --locked
      - name: Verify ordinary native CLI without the harness (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & ./target/debug/birdman-game-bevy.exe --help
          if ($LASTEXITCODE -ne 0) { throw 'Native help failed' }
          & ./target/debug/birdman-game-bevy.exe --version
          if ($LASTEXITCODE -ne 0) { throw 'Native version failed' }
          $output = & ./target/debug/birdman-game-bevy.exe --verify unused --offscreen 2>&1 | Out-String
          if ($LASTEXITCODE -eq 0 -or $output -notmatch 'requires --features verify-harness') {
            throw "Native harness flag was not rejected: $output"
          }
          $global:LASTEXITCODE = 0
      - name: Measure native hybrid hot-path allocations
        run: python tools/allocation-check/main.py
      - name: Verify offline environment source extraction
        run: python -m unittest discover -s tools/environment-build -v
      - name: Test native artifact packaging
        run: python -m unittest discover -s tools/native-release -v
      - run: cargo doc --workspace --no-deps --locked
      - name: Verify core without std
        run: cargo build -p birdman-game-core --target wasm32v1-none --locked
      - name: Build browser WASM adapter
        run: cargo build -p birdman-game-wasm --target wasm32-unknown-unknown --locked
      - name: Build WASI CLI
        run: cargo build -p birdman-game-cli --target wasm32-wasip2 --locked
      - name: Install matching wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli --locked --version 0.2.129
      - run: cargo run -p birdman-game-cli --locked
      - run: npm ci
      - run: npm run verify
      - name: Configure GitHub Pages
        if: matrix.os == 'ubuntu-24.04' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.deploy_pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Upload verified site
        if: matrix.os == 'ubuntu-24.04' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.deploy_pages
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: web/dist

  verus-proof:
    name: Verus proof (Windows)
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Verify production core and designated rejections
        shell: pwsh
        run: ./tools/verus/check-verus.ps1

  deploy:
    name: Deploy GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.deploy_pages
    needs: [verify, verus-proof]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy verified site
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
